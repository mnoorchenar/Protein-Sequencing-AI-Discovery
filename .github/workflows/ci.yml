name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t protein-target-explorer .
      - name: Check that the container serves requests
        run: |
          docker run -d --name app -p 7860:7860 protein-target-explorer
          for attempt in $(seq 1 15); do
            curl --fail --silent http://localhost:7860/healthz && exit 0
            sleep 2
          done
          docker logs app
          exit 1
