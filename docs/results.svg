<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="290" viewBox="0 0 1000 290" role="img" aria-labelledby="title desc" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">Correct protein IDs out of 94 AI suggestions</title>
  <desc id="desc">The AI alone gave the correct ID for 19 of 94 suggestions, or 20 percent. With this app's verification, 92 of 94 were verified, or 98 percent. The app corrected 73 wrong IDs and dropped 2 rather than guess.</desc>
  <style>
    .heading { fill: #0f172a; font-size: 24px; font-weight: 700; }
    .name { fill: #0f172a; font-size: 19px; font-weight: 600; }
    .value { font-size: 22px; font-weight: 700; text-anchor: end; }
    .note { fill: #334155; font-size: 18px; }
    .strong { font-weight: 700; }
  </style>
  <rect x="1" y="1" width="998" height="288" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <text class="heading" x="32" y="48">Correct protein IDs, out of 94 AI suggestions</text>

  <text class="name" x="32" y="96">AI alone</text>
  <text class="value" x="968" y="96" fill="#64748b">20%  (19 of 94)</text>
  <rect x="32" y="108" width="936" height="34" rx="6" fill="#e2e8f0"/>
  <rect x="32" y="108" width="189" height="34" rx="6" fill="#64748b"/>

  <text class="name" x="32" y="180">With this app</text>
  <text class="value" x="968" y="180" fill="#0f766e">98%  (92 of 94)</text>
  <rect x="32" y="192" width="936" height="34" rx="6" fill="#e2e8f0"/>
  <rect x="32" y="192" width="916" height="34" rx="6" fill="#0f766e"/>

  <text class="note" x="32" y="264"><tspan class="strong">73</tspan> wrong IDs corrected by protein name, and <tspan class="strong">2</tspan> dropped rather than guessed</text>
</svg>
