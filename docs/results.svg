<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" role="img" aria-labelledby="title desc" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">What 94 AI-suggested protein IDs pointed to</title>
  <desc id="desc">19 pointed to the correct protein, 61 to a different human protein, 13 to a protein from another species, and 1 to nothing in UniProt. So 75 of 94 IDs, or 80 percent, were wrong.</desc>
  <style>
    .heading { fill: #0f172a; font-size: 23px; font-weight: 700; }
    .pct { fill: #ffffff; font-size: 20px; font-weight: 700; text-anchor: middle; }
    .wrong { fill: #b42318; font-size: 18px; font-weight: 700; text-anchor: middle; }
    .right { fill: #0f766e; font-size: 18px; font-weight: 700; text-anchor: middle; }
    .item { fill: #0f172a; font-size: 17px; }
    .count { font-weight: 700; }
  </style>
  <rect x="1" y="1" width="998" height="268" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <text class="heading" x="32" y="46">What 94 AI-suggested protein IDs pointed to</text>

  <text class="right" x="125" y="84">Right: 19</text>
  <text class="wrong" x="611" y="84">Wrong: 75 of 94 (80%)</text>
  <path d="M32 94H217" fill="none" stroke="#0f766e" stroke-width="2"/>
  <path d="M222 94H968" fill="none" stroke="#b42318" stroke-width="2"/>

  <rect x="32" y="104" width="190" height="56" fill="#0f766e"/>
  <rect x="222" y="104" width="607" height="56" fill="#b42318"/>
  <rect x="829" y="104" width="129" height="56" fill="#e8590c"/>
  <rect x="958" y="104" width="10" height="56" fill="#64748b"/>
  <text class="pct" x="127" y="139">20%</text>
  <text class="pct" x="525" y="139">65%</text>
  <text class="pct" x="893" y="139">14%</text>

  <rect x="32" y="188" width="18" height="18" rx="3" fill="#0f766e"/>
  <text class="item" x="58" y="203"><tspan class="count">19</tspan> The correct protein</text>
  <rect x="522" y="188" width="18" height="18" rx="3" fill="#b42318"/>
  <text class="item" x="548" y="203"><tspan class="count">61</tspan> A different human protein</text>
  <rect x="32" y="224" width="18" height="18" rx="3" fill="#e8590c"/>
  <text class="item" x="58" y="239"><tspan class="count">13</tspan> A protein from another species</text>
  <rect x="522" y="224" width="18" height="18" rx="3" fill="#64748b"/>
  <text class="item" x="548" y="239"><tspan class="count">1</tspan> An ID that isn't in UniProt</text>
</svg>
